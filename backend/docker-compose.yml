# Local development dependencies (Postgres + Redis).
# Run: docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-social_media}
      POSTGRES_USER: ${POSTGRES_USER:-social_media}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-social_media}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-social_media}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  pgdata:
